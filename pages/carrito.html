<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — Norte Lanas</title>
    <link rel="icon" type="image/png" href="../imgs/nortelanas_logo.png">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <header>
        <img src="../imgs/nortelanas_logo.png" alt="Norte Lanas">
        <nav>
            <ul id="menuNavegacion">
                <!-- navbar.js arma este menú -->
            </ul>
        </nav>
    </header>

    <main>
        <h1>🛒 Mi carrito</h1>

        <!-- carrito.js llena este contenedor con los productos -->
        <div id="contenedorCarrito"></div>

        <!-- Esta sección se muestra solo si hay productos -->
        <div id="seccionTotal">
            <p>Total: <span id="totalCarrito"></span></p>
            <button onclick="vaciarCarrito()">Vaciar carrito</button>
        </div>
    </main>

    <footer>© 2026 Norte Lanas</footer>

    <script src="../js/navbar.js"></script>
    <script src="../js/carrito.js"></script>

</body>
</html>
